# CR-10 V3 / MKS Robin Nano v3.1 reference configuration
# Review and verify before use.

[include mainsail.cfg]
[include macros.cfg]

[mcu]
serial: /dev/serial/by-id/REPLACE_WITH_YOUR_MCU_BY_ID

[printer]
kinematics: cartesian
max_velocity: 400
max_accel: 4250
max_z_velocity: 20
max_z_accel: 150

[stepper_x]
step_pin: PE3
dir_pin: PE2
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
endstop_pin: !PA15
position_endstop: 0
position_max: 300
homing_speed: 80

[tmc2209 stepper_x]
uart_pin: PD5
run_current: 0.800
stealthchop_threshold: 999999

[stepper_y]
step_pin: PE0
dir_pin: PB9
enable_pin: !PE1
microsteps: 16
rotation_distance: 40
endstop_pin: !PD2
position_endstop: 0
position_max: 300
homing_speed: 80

[tmc2209 stepper_y]
uart_pin: PD7
run_current: 0.800
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB5
dir_pin: PB4
enable_pin: !PB8
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 400

[tmc2209 stepper_z]
uart_pin: PD4
run_current: 0.800
stealthchop_threshold: 999999

[stepper_z1]
step_pin: PD6
dir_pin: PD3
enable_pin: !PB3
microsteps: 16
rotation_distance: 8

[tmc2209 stepper_z1]
uart_pin: PD9
run_current: 0.800
stealthchop_threshold: 999999

[extruder]
step_pin: PD15
dir_pin: PD14
enable_pin: !PC7
microsteps: 16
rotation_distance: 7.71
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC3
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC1
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 285

[tmc2209 extruder]
uart_pin: PD8
run_current: 0.650
stealthchop_threshold: 999999

[heater_bed]
heater_pin: PA0
sensor_type: Generic 3950
sensor_pin: PC0
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 120

[bltouch]
sensor_pin: ^PC8
control_pin: PA8
x_offset: 0
y_offset: 0
z_offset: 0

[safe_z_home]
home_xy_position: 105,150
speed: 80
z_hop: 10
z_hop_speed: 10

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 20,20
mesh_max: 280,280
probe_count: 5,5

[z_tilt]
z_positions:
    -30,150
    330,150
points:
    60,150
    240,150
speed: 120
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.02

[fan]
pin: PB1

[heater_fan hotend_fan]
pin: PB0
heater: extruder
heater_temp: 50.0

[fan_generic case_fans]
pin: PA1
kick_start_time: 0.5

[filament_switch_sensor filament_sensor]
switch_pin: ^PA4
pause_on_runout: true

